<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="calculator">

        <!-- Header -->

        <div class="calculator-header">

            <div>
                <span class="icon">▣</span>
                <span>Calculator</span>
            </div>

            <span class="status">●</span>

        </div>


        <!-- Display -->

        <div class="display">

            <div id="previous-operation">
            </div>

            <div id="current-display">
                0
            </div>

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button
                class="special"
                data-key="Escape"
                onclick="clearDisplay()">
                AC
            </button>


            <button
                class="delete"
                data-key="Backspace"
                onclick="deleteLast()">
                ⌫
            </button>


            <button
                class="operator"
                data-key="/"
                onclick="chooseOperator('/')">
                ÷
            </button>


            <button
                class="operator"
                data-key="*"
                onclick="chooseOperator('*')">
                ×
            </button>


            <button
                data-key="7"
                onclick="appendNumber('7')">
                7
            </button>


            <button
                data-key="8"
                onclick="appendNumber('8')">
                8
            </button>


            <button
                data-key="9"
                onclick="appendNumber('9')">
                9
            </button>


            <button
                class="operator"
                data-key="-"
                onclick="chooseOperator('-')">
                −
            </button>


            <button
                data-key="4"
                onclick="appendNumber('4')">
                4
            </button>


            <button
                data-key="5"
                onclick="appendNumber('5')">
                5
            </button>


            <button
                data-key="6"
                onclick="appendNumber('6')">
                6
            </button>


            <button
                class="operator"
                data-key="+"
                onclick="chooseOperator('+')">
                +
            </button>


            <button
                data-key="1"
                onclick="appendNumber('1')">
                1
            </button>


            <button
                data-key="2"
                onclick="appendNumber('2')">
                2
            </button>


            <button
                data-key="3"
                onclick="appendNumber('3')">
                3
            </button>


            <button
                class="equals"
                data-key="Enter"
                onclick="calculate()">
                =
            </button>


            <button
                class="zero"
                data-key="0"
                onclick="appendNumber('0')">
                0
            </button>


            <button
                data-key="."
                onclick="appendNumber('.')">
                .
            </button>

        </div>


        <!-- Keyboard hint -->

        <div class="keyboard-hint">

            

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
