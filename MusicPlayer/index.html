<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vibe Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-player"> 

        <!-- Header -->
        <div class="top-bar">
            <div class="brand">
                <span class="brand-icon">♫</span>
                <span>Music Player</span>
            </div>

            <span class="menu">⋮</span>
        </div>


        <!-- Now Playing -->
        <div class="now-playing">
            NOW PLAYING
        </div>


        <!-- Album Cover -->
        <div class="album-container">
            <img
                id="album-cover"
                src="images/cover1.jpg"
                alt="Album Cover"
            >
        </div>


        <!-- Song Information -->
        <div class="song-info">

            <div>
                <h1 id="song-title">
                    	Cruel Summer
ummer
                </h1>

                <p id="artist">
                    Taylor Swift
                </p>
            </div>

            <button id="like-button">
                ♡
            </button>

        </div>


        <!-- Audio -->
        <audio id="audio"></audio>


        <!-- Progress -->
        <div class="progress-area">

            <span id="current-time">
                0:00
            </span>

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
            >

            <span id="duration">
                0:00
            </span>

        </div>


        <!-- Main Controls -->
       <div class="controls">

    <!-- Shuffle -->
    <button id="shuffle" class="control-icon" title="Shuffle">
        <svg viewBox="0 0 24 24">
            <path d="M16 3h5v5"></path>
            <path d="M4 20l5.5-5.5"></path>
            <path d="M14.5 9.5L21 3"></path>
            <path d="M16 16h5v5"></path>
            <path d="M4 4l5 5"></path>
            <path d="M14 14l7 7"></path>
        </svg>
    </button>


    <!-- Previous -->
    <button id="previous" class="control-icon" title="Previous">
        <svg viewBox="0 0 24 24">
            <path d="M19 5L9 12l10 7V5z"></path>
            <line x1="5" y1="5" x2="5" y2="19"></line>
        </svg>
    </button>


    <!-- Play -->
    <button id="play">
        ▶
    </button>


    <!-- Next -->
    <button id="next" class="control-icon" title="Next">
        <svg viewBox="0 0 24 24">
            <path d="M5 5l10 7-10 7V5z"></path>
            <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
    </button>


    <!-- Repeat -->
    <button id="repeat" class="control-icon" title="Repeat">
        <svg viewBox="0 0 24 24">
            <path d="M17 2l4 4-4 4"></path>
            <path d="M3 11V9a3 3 0 0 1 3-3h15"></path>
            <path d="M7 22l-4-4 4-4"></path>
            <path d="M21 13v2a3 3 0 0 1-3 3H3"></path>
        </svg>
    </button>

</div>

        <!-- Volume -->
        <div class="volume-area">

    <button id="volume-button" class="volume-button" title="Volume">

        <svg id="volume-icon" viewBox="0 0 32 32">

            <!-- Speaker -->
            <path
                class="speaker"
                d="M4 12h6l7-6v20l-7-6H4z">
            </path>

            <!-- Volume waves -->
            <path
                id="wave1"
                class="wave"
                d="M21 12c2 2 2 6 0 8">
            </path>

            <path
                id="wave2"
                class="wave"
                d="M24 9c4 4 4 10 0 14">
            </path>

            <path
                id="wave3"
                class="wave"
                d="M27 6c6 6 6 14 0 20">
            </path>

        </svg>

    </button>


    <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="1"
    >

</div>


        <!-- Playlist -->
        <div class="playlist-header">

            <h2>
                Playlist
            </h2>

            <span id="song-count">
                3 songs
            </span>

        </div>


        <div id="playlist"></div>

    </div>


    <script src="script.js"></script>

</body>
</html>
